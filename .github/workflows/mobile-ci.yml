name: Mobile CI

# Same shape as frontend-ci.yml: no workflow-level `paths:` filter, because a
# path-filtered workflow that doesn't trigger reports no status at all and would
# deadlock a required check on PRs that don't touch mobile/. Filtering happens
# per-job below, and `mobile-ci-ok` always runs so it can be the required check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect mobile changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile-ci.yml'
              # Generated into mobile/: the API types and the colour tokens.
              - 'docs/api/openapi.json'
              - 'tools/api/**'
              - 'tools/design/**'

  lint-test-export:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # src/lib/types/api.gen.ts comes from docs/api/openapi.json, so the type
      # check below is a check against the backend's real shapes. The contrast
      # audit of these same colours runs in frontend-ci.
      - name: Check generated API types are current
        run: node ../tools/api/gen-types.mjs --check

      - name: Check generated colour tokens are current
        run: node ../tools/design/palette.mjs --check

      - name: Lint
        run: npm run lint

      - name: Check formatting with oxfmt
        run: npm run format:check

      # Typed routes live in .expo/types (gitignored) and only the dev server writes
      # them, so without this step tsc types every href as a plain string and a link
      # to a screen that does not exist passes. This writes them without a server.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test -- --ci

      # Every package at the version this Expo SDK expects. Catches a Dependabot
      # bump that compiles but would break the native build.
      - name: Check Expo dependencies
        run: npx expo-doctor@1

      # Bundles the JavaScript for Android: catches import and Metro errors
      # without a native build, which needs EAS and minutes CI does not have.
      - name: Export Android bundle
        run: npm run export:android

  # Always runs, so it is safe to mark as a required status check in the branch
  # ruleset. Passes when lint-test-export succeeded or was skipped as irrelevant.
  mobile-ci-ok:
    needs: [lint-test-export]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report mobile CI result
        run: |
          result="${{ needs.lint-test-export.result }}"
          echo "lint-test-export: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi
