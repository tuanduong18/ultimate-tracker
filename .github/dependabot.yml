version: 2

# `prefix: chore` keeps Dependabot PR titles passing pr-title.yml. npm splits
# majors into their own group so a breaking major can't block routine
# minor/patch updates.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # First, so it claims these before the catch-all groups. Oxfmt is 0.x,
      # where a minor release can change formatting; in its own PR a reformat
      # can ride along without holding up everything else.
      oxc:
        patterns: ["oxlint", "oxfmt"]
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-major:
        patterns: ["*"]
        update-types: [major]
    # No ignore list: a major arrives alone in frontend-major, so even one that
    # needs migration work can't hold anything else up.

  # Grouped like /frontend, so a breaking major waits in its own PR instead of
  # holding up the week's routine updates (as two majors did in #123).
  #
  # Each ignore rule stops a PR that would fail CI or quietly mislead. An Expo
  # SDK fixes the versions of the packages on its list (bundledNativeModules.json
  # in the expo package), and CI's expo-doctor step fails as soon as one drifts.
  # Those move together in a deliberate SDK upgrade PR instead
  # (`npx expo install expo@^<next> --fix`).
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Same split as /frontend: Oxfmt minors can change formatting.
      oxc:
        patterns: ["oxlint", "oxfmt"]
      mobile:
        patterns: ["*"]
        update-types: [minor, patch]
      mobile-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # Expo's list pins these to one exact version (react 19.3.0, react-dom
      # 19.3.0, react-native 0.88.1), so any update fails expo-doctor, patches
      # included: react 19.3.1 is already out. They move only when the expo
      # package changes its list; if an expo patch does, run
      # `npx expo install --fix` on that PR's branch.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # Every Expo package (expo, the expo-* modules, jest-expo) is versioned
      # with the SDK: 58.x.y belongs to SDK 58. Expo's list allows its modules
      # patch releases only (~58.0.x), and modules do ship minors mid-SDK
      # (expo-router 56.1.x during SDK 56), so a minor fails expo-doctor and a
      # major is the next SDK. Patches still come through.
      - dependency-name: "*expo*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Expo's list pins its React Native libraries to patches too
      # (react-native-safe-area-context ~5.10.1, react-native-screens ~4.30.1),
      # and safe-area-context 5.11.1 is already out. A react-native-* library
      # added later that isn't on Expo's list is held to patches as well; take
      # its minors by hand.
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # jest-expo 58 requires jest ^29 || ^30, so jest 31 can't run until an SDK
      # upgrade brings a jest-expo that supports it.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      # The types for the React that Expo pins. They're not on Expo's list, so
      # expo-doctor wouldn't object, but a newer minor describes React APIs the
      # app's runtime doesn't have, and nothing in CI would notice. They move
      # with React in the SDK upgrade; 19.3 type fixes still come through.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One group, no update-types split: requirements.txt holds ranges with no
      # lock file, so Dependabot has no resolved version to classify an update
      # as major/minor/patch. Filtered groups then match nothing and every bump
      # arrives as its own PR.
      backend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One group: action majors are low-risk and self-testing.
      actions:
        patterns: ["*"]
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
        update-types: [major, minor, patch]
