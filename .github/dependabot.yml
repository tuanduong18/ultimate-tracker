version: 2

# `prefix: chore` keeps Dependabot PR titles passing pr-title.yml. npm splits
# majors into their own group so a breaking major can't block routine
# minor/patch updates.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-major:
        patterns: ["*"]
        update-types: [major]

  # One group, so every week's bumps arrive as a single PR, like the backend's.
  #
  # The ignore list keeps that PR mergeable. An Expo SDK pins React and React
  # Native exactly and its own packages to patch releases (bundledNativeModules
  # in the expo package), so a minor or major bump of any of them fails CI's
  # expo-doctor step — and in a single group, one failing bump blocks the rest.
  # Those move together in a deliberate SDK upgrade PR instead
  # (`npx expo install expo@^<next> --fix`); their patch releases still come
  # through here.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      mobile:
        patterns: ["*"]
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "expo"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # jest-expo supports jest 29 and 30 only.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One group, no update-types split: requirements.txt holds ranges with no
      # lock file, so Dependabot has no resolved version to classify an update
      # as major/minor/patch. Filtered groups then match nothing and every bump
      # arrives as its own PR.
      backend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One group: action majors are low-risk and self-testing.
      actions:
        patterns: ["*"]
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
        update-types: [major, minor, patch]
