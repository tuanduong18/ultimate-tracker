# Opt-in local hooks so lint/format failures surface before CI.
# Install once with:  pip install pre-commit && pre-commit install
# CI does not run this file — it runs ruff / prettier / eslint directly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Keep this rev equal to the ruff CI installs — the newest release inside the
  # range in backend/requirements.txt (`pip index versions ruff`) — or the hook
  # and CI disagree on formatting. When Dependabot widens that range, bump this
  # in the same PR. (`pre-commit autoupdate` jumps to the newest tag, which can
  # be outside the range, so check what it picked.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # The frontend's own prettier, not a mirror pinned here: it is whatever
  # package-lock.json says, so the hook and `npm run format:check` cannot drift.
  # Needs `npm ci` in frontend/ first. pre-commit runs hooks from the repo root,
  # where frontend/.prettierignore is not picked up on its own — hence
  # --ignore-path, without which the hook reformats tsconfig.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend/node_modules)
        language: system
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown --ignore-path frontend/.prettierignore
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|next-env\.d\.ts)$
