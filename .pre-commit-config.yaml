# Opt-in local hooks so lint/format failures surface before CI.
# Install once with:  pip install pre-commit && pre-commit install
# CI does not run this file — it runs ruff / oxfmt / oxlint directly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Keep this rev equal to the ruff CI installs — the newest release inside the
  # range in backend/requirements.txt (`pip index versions ruff`) — or the hook
  # and CI disagree on formatting. When Dependabot widens that range, bump this
  # in the same PR. (`pre-commit autoupdate` jumps to the newest tag, which can
  # be outside the range, so check what it picked.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # The frontend's own oxfmt, not a mirror pinned here: it is whatever
  # package-lock.json says, so the hook and `npm run format:check` cannot drift.
  # Needs `npm ci` in frontend/ first. pre-commit runs hooks from the repo root,
  # where frontend/.oxfmtrc.jsonc is not picked up on its own — hence -c, without
  # which the hook formats with oxfmt's defaults (double quotes) and touches the
  # files the config ignores, such as tsconfig.json. Files oxfmt can't format
  # (images, SVG) are skipped.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (frontend/node_modules)
        language: system
        entry: node frontend/node_modules/oxfmt/bin/oxfmt -c frontend/.oxfmtrc.jsonc --no-error-on-unmatched-pattern
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|next-env\.d\.ts)$
      # Same idea for the Android app: its own locked oxfmt and config.
      # Needs `npm ci` in mobile/ first.
      - id: oxfmt-mobile
        name: oxfmt (mobile/node_modules)
        language: system
        entry: node mobile/node_modules/oxfmt/bin/oxfmt -c mobile/.oxfmtrc.jsonc --no-error-on-unmatched-pattern
        files: ^mobile/
        exclude: ^mobile/(package-lock\.json|expo-env\.d\.ts)$
      # Generated files must match their generators (tools/README.md). Both
      # checks need only Node, and CI runs the same two commands. The schema
      # itself (docs/api/openapi.json) is checked in CI, where Python and the
      # backend's dependencies are known to be installed.
      - id: api-types-current
        name: generated API types are current
        language: system
        entry: node tools/api/gen-types.mjs --check
        pass_filenames: false
        files: ^(docs/api/openapi\.json|tools/api/|frontend/lib/types/api\.gen\.ts|mobile/src/lib/types/api\.gen\.ts)
      - id: colour-tokens-current
        name: generated colour tokens are current
        language: system
        entry: node tools/design/palette.mjs --check
        pass_filenames: false
        files: ^(tools/design/|frontend/app/globals\.css|frontend/lib/theme\.ts|mobile/src/theme/tokens\.ts)
